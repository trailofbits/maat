name: Python wheels

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: manylinux_x86_64 }
          - { runner: macos-26-intel, platform: macosx_x86_64, deployment: '10.15' }
          - { runner: macos-26, platform: macosx_arm64, deployment: '11.0' }
    name: Wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          enable-cache: false

      - name: Select PR smoke build
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE...$HEAD_SHA" -- pyproject.toml .github/workflows/python-package.yml .github/ci/install-wheel-deps.sh bindings/bindings.cmake cmake/install-rules.cmake CMakeLists.txt; then
            echo 'CIBW_BUILD=cp313-{manylinux_x86_64,macosx_x86_64,macosx_arm64}' >> "$GITHUB_ENV"
          fi

      - name: Build, repair, and test wheels
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
        run: uvx --python 3.13 --from 'cibuildwheel[uv]==4.3.5' cibuildwheel

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymaat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
